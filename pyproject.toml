[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molfuse"
version = "4.0.0"
description = "Molecular Function-Guided Virtual Screening (UMMBAS)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.7",
    "joblib>=1.4",
    "umap-learn>=0.5.11",
    "rdkit>=2024.09",
    "mordred>=1.2",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "pyarrow>=17",
]

[project.optional-dependencies]
# Required for post-analysis scripts (scripts/phase*_post_analysis.py)
analysis = [
    "seaborn>=0.13",
    "polars>=1.0",
]
# All optional extras
all = [
    "seaborn>=0.13",
    "polars>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["molfuse*"]
